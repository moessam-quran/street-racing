<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a1c">
<meta name="mobile-web-app-capable" content="yes">
<title>سباق الشوارع</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#070a1c;font-family:'Segoe UI',Tahoma,Roboto,Arial,sans-serif;color:#fff}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{position:absolute}
.pill{background:rgba(5,8,25,.55);border:1px solid rgba(120,200,255,.25);border-radius:14px;padding:4px 12px;backdrop-filter:blur(3px)}
#posBox{top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));text-align:center;line-height:1}
#posBox b{font-size:34px;color:#ffd84a;text-shadow:0 0 12px #ff9d00}
#posBox small{font-size:13px;opacity:.85;display:block}
#lapBox{top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;font-size:15px;white-space:nowrap}
#lapBox b{color:#6fe3ff}
#prog{top:calc(52px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(46vw,380px);height:8px;background:rgba(255,255,255,.18);border-radius:6px}
#prog i{position:absolute;top:-4px;width:12px;height:16px;margin-left:-6px;border-radius:5px;background:#889;border:1px solid #000}
#prog i.me{background:#ffd84a;box-shadow:0 0 8px #ffb300;z-index:2;width:14px;height:20px;top:-6px}
#topBtns{top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));display:flex;gap:8px;pointer-events:auto}
.rb{width:44px;height:44px;border-radius:50%;background:rgba(5,8,25,.55);border:1px solid rgba(120,200,255,.35);font-size:20px;color:#fff;display:flex;align-items:center;justify-content:center}
#gauge{bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:170px;text-align:center}
#gauge canvas{width:170px;height:104px;display:block}
#spd{position:absolute;left:0;right:0;top:44px;font-size:34px;font-weight:800;line-height:1;text-shadow:0 0 10px #00c8ff}
#spd small{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:2px}
#nbar{height:10px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden;margin-top:2px;border:1px solid rgba(0,0,0,.4)}
#nbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#00b7ff,#7af3ff);transform-origin:right}
#nbar.on i{background:linear-gradient(90deg,#ff7a00,#ffe14a)}
#banner{top:30%;left:0;right:0;text-align:center;font-size:clamp(34px,9vw,84px);font-weight:900;color:#fff;text-shadow:0 0 18px #00c8ff,0 4px 0 #0007;opacity:0;transition:opacity .25s,transform .25s;transform:scale(1.3)}
#banner.show{opacity:1;transform:scale(1)}
#banner.small{font-size:clamp(22px,5vw,44px);top:24%}
#flash{inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,30,30,.65));opacity:0;transition:opacity .35s}
#lines{inset:0;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 52%,rgba(255,255,255,0) 0deg 5deg,rgba(255,255,255,.2) 5.4deg 6deg);-webkit-mask:radial-gradient(ellipse at 50% 52%,transparent 35%,#000 85%);mask:radial-gradient(ellipse at 50% 52%,transparent 35%,#000 85%)}
.ctl{pointer-events:auto;position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:rgba(10,18,50,.45);border:2px solid rgba(120,220,255,.55);backdrop-filter:blur(2px);text-shadow:0 2px 4px #000}
.ctl.on{background:rgba(0,180,255,.55);transform:scale(.94)}
#bL,#bR{bottom:calc(18px + env(safe-area-inset-bottom));width:clamp(74px,19vh,104px);height:clamp(74px,19vh,104px);font-size:38px;border-radius:26px}
#bL{left:calc(14px + env(safe-area-inset-left))}
#bR{left:calc(clamp(74px,19vh,104px) + 30px + env(safe-area-inset-left))}
#bN{bottom:calc(20px + env(safe-area-inset-bottom));right:calc(16px + env(safe-area-inset-right));width:clamp(84px,24vh,120px);height:clamp(84px,24vh,120px);font-size:17px;border-color:#ffb300;background:rgba(255,140,0,.35)}
#bN.on{background:rgba(255,190,0,.75)}
#bB{bottom:calc(30px + env(safe-area-inset-bottom));right:calc(clamp(84px,24vh,120px) + 34px + env(safe-area-inset-right));width:clamp(60px,16vh,84px);height:clamp(60px,16vh,84px);font-size:14px;border-color:#ff5a5a;background:rgba(255,50,50,.3)}
.drag #bL,.drag #bR,.tilt #bL,.tilt #bR{display:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;z-index:5;overflow:auto;touch-action:pan-y}
.screen.dim{background:rgba(3,5,18,.72)}
.screen.side{align-items:flex-start;justify-content:flex-end;background:linear-gradient(0deg,rgba(3,5,18,.92),rgba(3,5,18,.0) 70%)}
h1{margin:0;font-size:clamp(34px,9vh,62px);font-style:italic;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#00d0ff,#ff3df2);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(0,200,255,.5))}
h2{margin:0;font-size:24px}
.sub{opacity:.8;font-size:15px}
.btn{pointer-events:auto;touch-action:manipulation;border:0;border-radius:16px;padding:12px 26px;font-size:19px;font-weight:800;color:#fff;font-family:inherit;background:linear-gradient(180deg,#19b8ff,#0a6dff);box-shadow:0 4px 0 #063a99,0 0 18px rgba(0,160,255,.4);min-width:190px;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #063a99}
.btn.go{background:linear-gradient(180deg,#ffd13a,#ff8a00);box-shadow:0 4px 0 #9a4c00,0 0 20px rgba(255,160,0,.5);font-size:23px;padding:14px 34px}
.btn.alt{background:linear-gradient(180deg,#4a4f78,#2c3050);box-shadow:0 4px 0 #14172b}
.btn.dis{opacity:.45;filter:grayscale(.6)}
.btn.sm{padding:6px 14px;font-size:14px;min-width:0;border-radius:11px}
.coins{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:6;font-weight:800;font-size:18px}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.panel{background:rgba(8,12,34,.8);border:1px solid rgba(120,200,255,.3);border-radius:16px;padding:10px 14px;width:min(94vw,520px);text-align:right}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.stat span{width:58px}
.bar{flex:1;height:9px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#00c8ff,#ff3df2)}
.up{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0;font-size:14px}
.pips{display:flex;gap:3px}.pips b{width:14px;height:8px;border-radius:3px;background:rgba(255,255,255,.2)}.pips b.f{background:#ffd13a}
table{border-collapse:collapse;width:min(92vw,460px);background:rgba(8,12,34,.8);border-radius:12px;overflow:hidden}
td{padding:5px 10px;font-size:15px;border-bottom:1px solid rgba(255,255,255,.1)}
tr.me td{background:rgba(255,200,0,.25);font-weight:800}
.opt{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.opt .btn{min-width:0;padding:8px 14px;font-size:15px}
.opt .btn.sel{background:linear-gradient(180deg,#ffd13a,#ff8a00);box-shadow:0 3px 0 #9a4c00}
@media (orientation:landscape){#sMenu{padding-left:46vw}.screen.side{justify-content:center}#sGarage .panel{width:min(48vw,430px);padding:8px 12px}}
#rot{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:7;background:#000a;border-radius:12px;padding:6px 14px;font-size:13px;pointer-events:none}
@media (max-height:420px){.btn{padding:8px 18px;font-size:16px}.screen{gap:6px}h1{font-size:34px}#gauge{transform:translateX(-50%) scale(.8);transform-origin:bottom center}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
 <div id="lines"></div><div id="flash"></div>
 <div id="posBox" class="pill"><small>المركز</small><b id="pos">6/6</b></div>
 <div id="lapBox" class="pill">لفة <b id="lap">1/3</b> &nbsp; <span id="tm">0:00.0</span></div>
 <div id="prog"></div>
 <div id="topBtns"><div class="rb" id="bPause">⏸</div><div class="rb" id="bMute">🔊</div></div>
 <div id="gauge"><canvas id="gc" width="340" height="208"></canvas><div id="spd"><span id="spdn">0</span><small>كم/س</small></div><div id="nbar"><i></i></div></div>
 <div id="banner"></div>
 <div class="ctl" id="bL">◀</div><div class="ctl" id="bR">▶</div>
 <div class="ctl" id="bN">نيترو<br>🔥</div><div class="ctl" id="bB">فرامل</div>
</div>
<div class="coins hidden" id="coinsBox">🪙 <span id="coins">0</span></div>

<div class="screen" id="sMenu">
 <h1>سباق الشوارع</h1>
 <div class="sub">سباق ليلي في المدينة · 3 لفات · 6 سواقين</div>
 <div class="sub" id="menuCar"></div>
 <button class="btn go" id="mStart">🏁 ابدأ السباق</button>
 <button class="btn" id="mGarage">🔧 الجراج</button>
 <button class="btn alt" id="mSet">⚙️ الإعدادات</button>
 <div class="sub" style="font-size:12px;opacity:.55">لف الموبايل بالعرض للتجربة الأحسن</div>
</div>

<div class="screen side hidden" id="sGarage">
 <div class="panel">
  <div class="row" style="justify-content:space-between">
   <button class="btn sm alt" id="gPrev">◀</button>
   <div><h2 id="gName"></h2><div class="sub" id="gState"></div></div>
   <button class="btn sm alt" id="gNext">▶</button>
  </div>
  <div id="gStats"></div>
  <div id="gUps"></div>
  <div class="row" style="margin-top:6px"><button class="btn" id="gBuy"></button><button class="btn alt" id="gBack">رجوع</button></div>
 </div>
</div>

<div class="screen dim hidden" id="sSet">
 <h2>الإعدادات</h2>
 <div class="panel">
  <div>طريقة التحكم</div>
  <div class="opt" id="oSteer"><button class="btn" data-v="buttons">أزرار</button><button class="btn" data-v="drag">سحب بالصباع</button><button class="btn" data-v="tilt">ميل الموبايل</button></div>
  <div class="opt" id="oInv" ><button class="btn" data-v="0">الميل عادي</button><button class="btn" data-v="1">اعكس الميل</button></div>
  <div>الرسومات</div>
  <div class="opt" id="oGfx"><button class="btn" data-v="1">خفيفة</button><button class="btn" data-v="2">متوسطة</button><button class="btn" data-v="3">عالية</button></div>
  <div>الصوت</div>
  <div class="opt" id="oSnd"><button class="btn" data-v="1">شغال</button><button class="btn" data-v="0">مقفول</button></div>
 </div>
 <button class="btn" id="sBack">تمام</button>
 <button class="btn alt sm" id="sReset">مسح كل التقدم</button>
</div>

<div class="screen dim hidden" id="sPause">
 <h2>وقفة</h2>
 <button class="btn go" id="pResume">كمّل</button>
 <button class="btn alt" id="pQuit">اخرج للقائمة</button>
</div>

<div class="screen dim hidden" id="sRes">
 <h2 id="rTitle"></h2>
 <table id="rTable"></table>
 <div id="rInfo" class="sub" style="font-size:17px"></div>
 <div class="row"><button class="btn go" id="rAgain">🏁 سباق تاني</button><button class="btn" id="rGarage">🔧 الجراج</button><button class="btn alt" id="rMenu">القائمة</button></div>
</div>
<div id="rot" class="hidden">لف الموبايل بالعرض 📱↔️</div>
